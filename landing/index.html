<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CutLab — your video editor, in the browser</title>
<meta name="description" content="CutLab is a timeline video editor that runs in your browser. Editing stays light on your machine; proxies, analysis and final renders run on the CutLab server or on your own Muse. Free during beta.">
<link rel="icon" href="assets/logo-mark.png">
<link rel="preload" href="assets/fonts/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="startpage">

<!-- UI ADOPTION 2026-11-06: the constellation field (drifting silver
     keyframe dots, faint connecting lines, sparse Signal Red dots)
     behind the brand. Painted by the script at the foot — deferred,
     reduced-motion gets one static frame, hidden tabs pause it. -->
<canvas id="sp-field" aria-hidden="true"></canvas>

<!-- Start page: one viewport, no scroll. Corners minimal, centre is the
     brand on its action bar, and the base is a lit timeline horizon. -->

<div class="sp-corner sp-tl sp-rise">
  <img src="assets/logo-mark.png" alt="CutLab logo">
  <span>CutLab</span>
</div>

<nav class="sp-corner sp-tr sp-rise" aria-label="Main">
  <a href="help/">Help</a>
  <a class="sp-signin" href="../">Sign in</a>
</nav>

<main class="sp-centre">
  <span class="sp-mark-wrap sp-rise"><span class="sp-halo" aria-hidden="true"></span><img class="sp-mark" src="assets/logo-mark.png" alt="CutLab logo" width="76" height="76"></span>
  <h1 class="sp-word sp-rise">CutLab</h1>
  <p class="sp-line sp-rise">Your video editor, in the browser.</p>

  <div class="sp-bar sp-rise" role="group" aria-label="Start">
    <a class="sp-primary" href="../">Open the editor</a>
    <a class="sp-quiet" href="../#new">New project</a>
    <button class="sp-quiet" type="button" id="demoOpen">Watch the demo</button>
  </div>
  <p class="sp-sub sp-rise">Free during beta &middot; Nothing to install</p>
</main>

<div class="sp-corner sp-bl sp-rise">
  <nav aria-label="Legal">
    <a href="legal/terms.html">Terms</a>
    <a href="legal/privacy.html">Privacy</a>
    <a href="legal/content-policy.html">Content policy</a>
  </nav>
</div>


<!-- THE BASE: a timeline horizon. Ruler ticks and clip blocks run the full
     width; the light concentrates at one Signal Red playhead. -->
<div class="sp-base" aria-hidden="true">
  <div class="sp-horizon"></div>
  <div class="sp-ruler"></div>
  <div class="sp-clips">
    <span class="k w1"></span><span class="k w2 alt"></span><span class="k w3"></span>
    <span class="k w4 alt"></span><span class="k w5"></span><span class="k w2"></span>
    <span class="k w6 alt"></span><span class="k w3"></span><span class="k w4"></span>
    <span class="k w1 alt"></span><span class="k w5"></span><span class="k w3 alt"></span>
  </div>
  <div class="sp-playhead"><span class="sp-glow"></span></div>
</div>

<!-- Demo overlay player (scroll-free) -->
<div class="sp-modal" id="demoModal" hidden role="dialog" aria-modal="true" aria-label="CutLab demo video">
  <div class="sp-modal-card">
    <button class="sp-modal-close" type="button" id="demoClose" aria-label="Close demo">&times;</button>
    <video id="demoVideo" controls preload="none" poster="assets/demo-poster.jpg" width="1920" height="1080">
      <source src="assets/demo.mp4" type="video/mp4">
    </video>
    <p>The editor as it ships today &mdash; 52 seconds, narrated. A real project, a prompt edit, a server render.</p>
  </div>
</div>

<script>
(function () {
  var modal = document.getElementById('demoModal');
  var openBtn = document.getElementById('demoOpen');
  var closeBtn = document.getElementById('demoClose');
  var video = document.getElementById('demoVideo');
  if (!modal || !openBtn || !closeBtn || !video) return;

  function open() {
    modal.hidden = false;
    closeBtn.focus();
    var p = video.play();
    if (p && p.catch) p.catch(function () { /* user can press play */ });
  }
  function close() {
    video.pause();
    modal.hidden = true;
    openBtn.focus();
  }
  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) close();
  });
})();
</script>

<script>
/* Constellation backdrop — values studied from the remake's
 * InteractiveBackdrop, restrained for our start page (slower drift,
 * no cursor beam or scan lines): silver dots, links under 110px,
 * ~12% Signal Red. Starts after load (zero first-paint cost),
 * pauses in hidden tabs, one static frame under reduced motion. */
(function () {
  var canvas = document.getElementById('sp-field');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dots = [], raf = 0, running = false;

  function seed() {
    var count = Math.min(46, Math.floor(W / 34));
    dots = [];
    for (var i = 0; i < count; i++) {
      dots.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.44, vy: (Math.random() - 0.5) * 0.44,
        size: Math.random() < 0.15 ? 3 : 1.5,
        alpha: Math.random() * 0.32 + 0.1,
        red: Math.random() < 0.12
      });
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < dots.length; i++) {
      var p = dots[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.red ? 'rgba(227,16,0,' + p.alpha + ')' : 'rgba(236,236,236,' + p.alpha + ')';
      ctx.fill();
      for (var j = i + 1; j < dots.length; j++) {
        var q = dots[j], dx = p.x - q.x, dy = p.y - q.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 110) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = (p.red || q.red)
            ? 'rgba(227,16,0,' + (0.12 * (1 - d / 110)) + ')'
            : 'rgba(168,168,168,' + (0.1 * (1 - d / 110)) + ')';
          ctx.lineWidth = 0.75;
          ctx.stroke();
        }
      }
    }
  }
  function step() {
    for (var i = 0; i < dots.length; i++) {
      var p = dots[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    }
    draw();
    raf = requestAnimationFrame(step);
  }
  function start() { if (!running && !reduced) { running = true; raf = requestAnimationFrame(step); } }
  function stop() { running = false; cancelAnimationFrame(raf); }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed(); draw();
  }
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 160);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });

  function init() { resize(); if (reduced) draw(); else start(); }
  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init);
})();
</script>

</body>
</html>
